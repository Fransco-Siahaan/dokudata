[project]
name = "dokudata"
version = "0.1.0"
description = "Document-to-data AI system: OCR, classification, field extraction, validation, calibrated confidence and human review for Indonesian receipts and invoices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pillow>=11",
  "opencv-python-headless>=4.10",
  "pymupdf>=1.25",
  "rapidocr>=3.0",
  "onnxruntime>=1.20",
  "pytesseract>=0.3.13",
  "scikit-learn>=1.6",
  "joblib>=1.4",
  "rapidfuzz>=3.10",
  "imagehash>=4.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "anthropic>=1,<2",
  "openpyxl>=3.1",
  "filetype>=1.2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "rq>=2.0",
  "boto3>=1.35",
]
ml = [
  "matplotlib>=3.9",
  "sentence-transformers>=3.3",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "ml*"]

[tool.pytest.ini_options]
pythonpath = [".", "apps"]
testpaths = ["tests"]
markers = [
  "slow: runs OCR or other heavy models",
  "regression: ML regression gate on the fixed mini set",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["pipeline", "apps/api"]
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "data", "ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S311", "B008", "E501", "SIM102", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "ml", "api", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"ml/**" = ["S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["pipeline", "apps/api"]
